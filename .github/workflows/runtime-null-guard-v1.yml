name: Runtime Null Guard v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-null-guard-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard removed splash lifecycle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""    setTimeout(() => {
      document.getElementById('splash').classList.add('hidden');
      document.getElementById('mainContent').classList.add('show');
    }, 2000);"""
          new="""    setTimeout(() => {
      document.getElementById('splash')?.classList.add('hidden');
      document.getElementById('mainContent')?.classList.add('show');
    }, 2000);"""
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('EXPECTED_LIFECYCLE_BLOCK_NOT_FOUND')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q "getElementById('splash')?.classList" index.html
          grep -q 'Eu exijo respeito ao não permitir que os outros me intimidem ou mandem em mim.' index.html
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Protege lifecycle quando splash não existe'
          git push
